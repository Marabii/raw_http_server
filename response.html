<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My first raw C epoll HTTP server</title>
    <style>
      :root {
        --bg: #0f1115;
        --fg: #e6e8ee;
        --muted: #8b90a0;
        --accent: #6cb6ff;
        --card: #171a21;
        --border: #262b36;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f6f7fb;
          --fg: #1b1e27;
          --muted: #5f6577;
          --accent: #0b6bcb;
          --card: #ffffff;
          --border: #dfe2ec;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--bg);
        color: var(--fg);
        font:
          16px/1.6 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      main {
        max-width: 34rem;
        width: 100%;
        padding: 2rem;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.75rem;
        line-height: 1.2;
      }
      h1 span {
        color: var(--accent);
      }
      p {
        margin: 0 0 1rem;
        color: var(--muted);
      }
      pre {
        margin: 0;
        padding: 1rem;
        overflow-x: auto;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        font:
          0.875rem/1.5 ui-monospace,
          "SF Mono",
          Menlo,
          Consolas,
          monospace;
      }
      .ok {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello from my first <span>raw C</span> epoll HTTP server</h1>
      <p>
        No frameworks, no libraries: just sockets, <code>epoll</code>, and a lot
        of bytes written by hand.
      </p>
      <pre><span class="ok">HTTP/1.1 200 OK</span>
Content-Type: text/html; charset=UTF-8
Connection: close

...and you're reading the body.</pre>
    </main>
  </body>
</html>
